[project]
name = "maple-diffusion"
version = "0.1.0"
description = "MAPLE: Mixed-precision Adaptive Patch-Level Execution for Diffusion Models"
authors = [{name = "Research Team", email = "research@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "diffusers>=0.21.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "datasets>=2.14.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "wandb>=0.15.0",
    "pillow>=10.0.0",
    "scipy>=1.11.0",
    "tensorboard>=2.13.0",
    "fvcore>=0.1.5",
    "einops>=0.7.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "lpips>=0.1.4",
    "pytorch-fid>=0.3.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]
